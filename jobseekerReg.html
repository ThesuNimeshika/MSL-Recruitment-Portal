<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Seeker Registration | MSL Recruitment</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap 5.0.2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Select CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
</head>
<body>
  <header>
    <div class="navbar">
      <div class="logo">MSL Careers</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Jobs</a>
        <a href="#">Employers</a>
        <a href="#">Job Seekers</a>
        <a href="#">Contact</a>
      </div>
      <div class="login-dropdown">
        <button class="login-dropdown-btn" onclick="toggleLoginDropdown(event)">Login</button>
        <div class="login-dropdown-content" id="loginDropdownMenu">
          <a href="#">MSL Login</a>
          <a href="#">Client Login</a>
          <a href="jobseekerReg.html">Job Seeker Login</a>
        </div>
      </div>
    </div>
    <div class="header-banner">
      <h1>Job Seeker Form</h1>
      <p>Start your journey to a better career. Complete your profile step by step.</p>
    </div>
  </header>

  <div class="layout" style="margin-top: 32px;">
    <div style="grid-column: 2 / 3; display: flex; justify-content: center; align-items: flex-start;">
      <div class="main-content">
        <div class="position-relative">
          <div id="form-toast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" style="position:absolute; top:0.5rem; left:50%; transform:translateX(-50%); min-width:320px; max-width:90vw; z-index:1055;">
            <div class="d-flex">
              <div class="toast-body" id="form-toast-body"></div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
          </div>
        </div>
        <form id="regForm">
          <!-- Step indicators -->
          <div style="display: flex; justify-content: center; margin-bottom: 1.5rem; gap: 0.5rem;">
            <span class="step-indicator" id="step-ind-0">1</span>
            <span class="step-indicator" id="step-ind-1">2</span>
          </div>
          <!-- Step 1: Personal Information -->
          <div class="tab personal-info-tab">
            <h2 style="text-align: center; color: #3a1c71; font-size: 2rem; margin-top: 0; margin-bottom: 2rem;">Personal Information</h2>
            <div class="form-row">
              <input type="text" id="firstName" placeholder="First Name *" required pattern="^[A-Za-z]+$" oninput="this.value=this.value.replace(/[^A-Za-z]/g,'')">
              <input type="text" id="lastName" placeholder="Last Name *" required pattern="^[A-Za-z]+$" oninput="this.value=this.value.replace(/[^A-Za-z]/g,'')">
            </div>
            <div class="form-row">
              <input type="email" id="email" placeholder="Email Address *" required>
              <input type="tel" id="phone" placeholder="Phone Number *" required pattern="^\d{10}$" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>
            <div class="form-row">
              <input type="tel" id="altPhone" placeholder="Alternate Phone" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
              <select class="form-select" id="contactMethod" required>
                <option value="">Preferred Contact Method</option>
                <option>Email</option>
                <option>Phone</option>
                <option>Alternate Phone</option>
              </select>
            </div>
            <div class="form-row">
              <input type="url" id="linkedin" placeholder="LinkedIn Profile URL">
              <input type="text" id="currentAddress" placeholder="Current Address">
            </div>
            <div class="form-row">
              <input type="text" id="nationality" placeholder="Nationality">
              <select class="form-select" id="workAuthStatus" required>
                <option value="">Work Authorization Status</option>
                <option>Citizen</option>
                <option>Permanent Resident</option>
                <option>Work Permit</option>
                <option>Student Visa</option>
                <option>Other</option>
              </select>
            </div>
            <div id="personal-info-errors" style="display:none;"></div>
          </div>
          <!-- Step 2: Current Position -->
          <div class="tab">
            <h2 style="text-align: center; color: #3a1c71; font-size: 2rem; margin-top: 0; margin-bottom: 2rem;">Current Position</h2>
            <div class="form-row">
              <input type="text" id="currentCompany" placeholder="Current Company *" required>
              <input type="text" id="currentTitle" placeholder="Current Title *" required>
            </div>
            <div class="form-row">
              <input type="text" id="industry" placeholder="Industry">
              <select class="form-select" id="companySize">
                <option value="">Company Size</option>
                <option>1-10 employees</option>
                <option>11-50 employees</option>
                <option>51-200 employees</option>
                <option>201-500 employees</option>
                <option>501-1000 employees</option>
                <option>1000+ employees</option>
              </select>
            </div>
            <div class="form-row">
              <input type="date" id="startDate" placeholder="Start Date">
              <input type="text" id="totalCompensation" placeholder="Current Total Compensation">
            </div>
            <div class="form-row" style="flex-direction: column;">
              <label for="keyResponsibilities" style="font-weight:600; color:#3a1c71; display:block; margin-bottom:0.5rem; font-size:1.1rem;">Key Responsibilities *</label>
              <textarea id="keyResponsibilities" placeholder="Describe your key responsibilities and achievements..." rows="4" required style="width: 100%; max-width: none; margin-bottom: 1rem; padding: 0.7rem 1.5rem; border-radius: 8px; border: 1.5px solid #c7d2ee; font-size: 1.28rem; resize: vertical; box-sizing: border-box;"></textarea>
            </div>
            <div class="form-row">
              <input type="number" id="teamSize" placeholder="Team Size Managed" min="0">
              <input type="text" id="budgetResponsibility" placeholder="Budget Responsibility">
            </div>
          </div>
          <!-- Navigation Buttons -->
          <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
            <button type="button" id="prevBtn" class="more-btn" onclick="nextPrev(-1)" title="Previous">
              <span aria-label="Previous" style="font-size:1.2rem;">&#x2039;</span>
            </button>
            <button type="button" id="nextBtn" class="more-btn" onclick="nextPrev(1)" title="Next">
              <span aria-label="Next" style="font-size:1.2rem;">&#x203A;</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 MSL Careers. All rights reserved.
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Bootstrap Select JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
  <script>
    let currentTab = 0;
    showTab(currentTab);
    function showTab(n) {
      let x = document.getElementsByClassName("tab");
      x[n].style.display = "block";
      // Step indicators
      for (let i = 0; i < 2; i++) {
        document.getElementById('step-ind-' + i).classList.remove('active-step');
      }
      document.getElementById('step-ind-' + n).classList.add('active-step');
      // Prev/Next
      document.getElementById("prevBtn").style.display = n == 0 ? "none" : "inline-block";
      document.getElementById("prevBtn").title = "Previous";
      document.getElementById("nextBtn").innerHTML = n == (x.length - 1) ? '<span aria-label="Submit" style="font-size:1.5rem;">&#x203A;</span>' : '<span aria-label="Next" style="font-size:1.5rem;">&#x203A;</span>';
      document.getElementById("nextBtn").title = n == (x.length - 1) ? "Submit" : "Next";
    }
    function nextPrev(n) {
      let x = document.getElementsByClassName("tab");
      if (n == 1 && !validateForm()) return false;
      x[currentTab].style.display = "none";
      currentTab = currentTab + n;
      if (currentTab >= x.length) {
        document.getElementById("regForm").submit();
        return false;
      }
      showTab(currentTab);
    }
    function validateForm() {
      let x, y, i, valid = true;
      x = document.getElementsByClassName("tab");
      y = x[currentTab].querySelectorAll("input, select, textarea");
      // Custom validation for Personal Information tab
      let allErrors = [];
      if (currentTab === 0) {
        let errors = [];
        const firstName = document.getElementById('firstName');
        const lastName = document.getElementById('lastName');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const linkedin = document.getElementById('linkedin');
        // First/Last Name: letters only
        if (!/^[A-Za-z]+$/.test(firstName.value)) {
          errors.push('First Name must contain letters only.');
          firstName.classList.add('invalid');
          valid = false;
        } else {
          firstName.classList.remove('invalid');
        }
        if (!/^[A-Za-z]+$/.test(lastName.value)) {
          errors.push('Last Name must contain letters only.');
          lastName.classList.add('invalid');
          valid = false;
        } else {
          lastName.classList.remove('invalid');
        }
        // Email: valid email
        if (!/^\S+@\S+\.\S+$/.test(email.value)) {
          errors.push('Please enter a valid email address.');
          email.classList.add('invalid');
          valid = false;
        } else {
          email.classList.remove('invalid');
        }
        // Phone: exactly 10 digits
        if (!/^\d{10}$/.test(phone.value)) {
          errors.push('Phone Number must be exactly 10 digits.');
          phone.classList.add('invalid');
          valid = false;
        } else {
          phone.classList.remove('invalid');
        }
        // LinkedIn: must start with linkedin.com/
        if (linkedin.value && !/^https?:\/\/(www\.)?linkedin\.com\//.test(linkedin.value) && !/^linkedin\.com\//.test(linkedin.value)) {
          errors.push('LinkedIn Profile URL must start with linkedin.com/');
          linkedin.classList.add('invalid');
          valid = false;
        } else {
          linkedin.classList.remove('invalid');
        }
        allErrors = errors;
        document.getElementById('personal-info-errors').style.display = 'none';
      }
      
      // Custom validation for Current Position tab
      if (currentTab === 1) {
        let errors = [];
        const currentCompany = document.getElementById('currentCompany');
        const currentTitle = document.getElementById('currentTitle');
        const keyResponsibilities = document.getElementById('keyResponsibilities');
        
        // Required fields validation for 2nd tab
        if (!currentCompany.value.trim()) {
          errors.push('Current Company is required.');
          currentCompany.classList.add('invalid');
          valid = false;
        } else {
          currentCompany.classList.remove('invalid');
        }
        if (!currentTitle.value.trim()) {
          errors.push('Current Title is required.');
          currentTitle.classList.add('invalid');
          valid = false;
        } else {
          currentTitle.classList.remove('invalid');
        }
        if (!keyResponsibilities.value.trim()) {
          errors.push('Key Responsibilities is required.');
          keyResponsibilities.classList.add('invalid');
          valid = false;
        } else {
          keyResponsibilities.classList.remove('invalid');
        }
        allErrors = errors;
      }
      
      // Default validation for all fields
      for (i = 0; i < y.length; i++) {
        if (y[i].hasAttribute('required') && y[i].value == "") {
          y[i].classList.add("invalid");
          valid = false;
        } else if (currentTab !== 0 && currentTab !== 1) {
          y[i].classList.remove("invalid");
        }
      }
      // Show toast if errors
      var toastEl = document.getElementById('form-toast');
      var toastBody = document.getElementById('form-toast-body');
      if (!valid && allErrors.length > 0) {
        toastBody.innerHTML = 'Please fill all required fields correctly.';
        var toast = new bootstrap.Toast(toastEl, { delay: 5000 });
        toast.show();
      } else {
        var toast = bootstrap.Toast.getInstance(toastEl);
        if (toast) toast.hide();
      }
      return valid;
    }
    function toggleLoginDropdown(e) {
      e.preventDefault();
      var dd = document.querySelector('.login-dropdown');
      dd.classList.toggle('show');
    }
    document.addEventListener('click', function(event) {
      var dd = document.querySelector('.login-dropdown');
      if (!dd.contains(event.target)) {
        dd.classList.remove('show');
      }
    });
    
    // No Bootstrap Select needed - using native dropdowns
    $(document).ready(function() {
      // All dropdowns now use native Bootstrap styling
    });
  </script>
</body>
</html>
